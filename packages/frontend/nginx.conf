server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests → backend service
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI insight generation (esp. local Ollama loading a model on first
        # request) can run well past nginx's default 60s proxy_read_timeout,
        # which surfaces as an opaque 504. Allow more than the backend's 120s
        # Ollama request timeout so its own error surfaces instead of a 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA fallback — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
