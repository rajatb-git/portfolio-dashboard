configuration:
  log_level:
    name: Log level
    description: Verbosity for the addon and backend logs.
  finnhub_api:
    name: Finnhub API URL
    description: Finnhub REST base URL (typically https://finnhub.io/api/v1).
  finnhub_api_key:
    name: Finnhub API key
    description: Personal API key for Finnhub. Get one free at finnhub.io.
network:
  3000/tcp: Frontend (optional direct access; leave blank to use Ingress only)
  3001/tcp: Backend API (optional direct access; leave blank to use Ingress only)
