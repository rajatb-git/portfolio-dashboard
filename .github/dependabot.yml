version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: pnpm
    directory: /packages/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch

  # Frontend npm dependencies
  - package-ecosystem: pnpm
    directory: /packages/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # FullCalendar packages must all sit on the same version — the plugins
      # pin core with a tilde peer range, and @fullcalendar/react depends on an
      # exact core version. A solo major bump therefore yields a tree that
      # cannot compile, which has broken the Docker build twice (#134, #124).
      #
      # A group would not help: @fullcalendar/daygrid, /interaction and /list
      # have no stable v7 at all (only betas and rcs), so even a grouped major
      # bump would drag core and react to 7.x while the plugins stayed on 6.x —
      # the same broken combination.
      #
      # Lift this once all five packages have a stable matching major, then
      # upgrade them together in one PR and port Calendar.tsx to the v7 API.
      - dependency-name: '@fullcalendar/*'
        update-types:
          - version-update:semver-major
    groups:
      # Keep the family moving in lockstep for the updates still allowed.
      fullcalendar:
        patterns:
          - '@fullcalendar/*'
        update-types:
          - minor
          - patch
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch

  # Root workspace tooling (Biome, knip, etc.)
  - package-ecosystem: pnpm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Same constraint as the frontend config above: the root scan also raises
      # @fullcalendar/* bumps against the workspace packages.
      - dependency-name: '@fullcalendar/*'
        update-types:
          - version-update:semver-major

  # GitHub Actions used by CI and release workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
