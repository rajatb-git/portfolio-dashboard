name: Release - Home Assistant Addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (defaults to release tag)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  require-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if manual run without tag
        run: |
          if [[ -z "${{ inputs.tag }}" ]]; then
            echo "❌ The 'tag' input is required for manual deployment.";
            exit 1
          fi

  build-and-push-ha-addon:
    needs: [require-tag]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-dashboard/ha-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Portfolio Dashboard (Home Assistant Addon - ${{ matrix.arch }})
            org.opencontainers.image.description=Self-hosted portfolio dashboard for stocks & crypto - HA addon (${{ matrix.arch }})
            org.opencontainers.image.authors=Rajat Bansal
            org.opencontainers.image.source=https://github.com/rajatb-git/portfolio-dashboard
            org.opencontainers.image.url=https://github.com/rajatb-git/portfolio-dashboard
            org.opencontainers.image.documentation=https://github.com/rajatb-git/portfolio-dashboard/blob/develop/portfolio-dashboard/DOCS.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Rajat Bansal

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./portfolio-dashboard/Dockerfile
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ha-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ha-${{ matrix.arch }}

  sync-addon-version:
    needs: [build-and-push-ha-addon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version from release tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is not a valid semver; skipping sync." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write version to addon config and package manifests
        if: steps.ver.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i -E "s/^version: \".*\"$/version: \"${VERSION}\"/" portfolio-dashboard/config.yaml
          for f in package.json packages/frontend/package.json packages/backend/package.json; do
            node -e "const fs=require('fs'); const f='$f'; const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version='${VERSION}'; fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');"
          done

      - name: Commit and push
        if: steps.ver.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-dashboard/config.yaml package.json packages/frontend/package.json packages/backend/package.json
          if git diff --staged --quiet; then
            echo "Versions already in sync; nothing to commit."
            exit 0
          fi
          git commit -m "ci: sync addon and package versions to ${{ steps.ver.outputs.version }} [skip ci]"
          git push origin develop
