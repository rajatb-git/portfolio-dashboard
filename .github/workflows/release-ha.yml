name: Release - Home Assistant Addon

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (defaults to release tag)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  require-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if manual run without tag
        run: |
          if [[ -z "${{ inputs.tag }}" ]]; then
            echo "❌ The 'tag' input is required for manual deployment.";
            exit 1
          fi

  build-and-push-ha-addon:
    needs: [require-tag]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '27'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-dashboard/ha-${{ matrix.arch }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=Portfolio Dashboard (Home Assistant Addon - ${{ matrix.arch }})
            org.opencontainers.image.description=Self-hosted portfolio dashboard for stocks & crypto - HA addon (${{ matrix.arch }})
            org.opencontainers.image.authors=Rajat Bansal
            org.opencontainers.image.source=https://github.com/rajatb-git/portfolio-dashboard
            org.opencontainers.image.url=https://github.com/rajatb-git/portfolio-dashboard
            org.opencontainers.image.documentation=https://github.com/rajatb-git/portfolio-dashboard/blob/develop/portfolio-dashboard/DOCS.md
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Rajat Bansal

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./portfolio-dashboard/Dockerfile
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ha-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ha-${{ matrix.arch }}
